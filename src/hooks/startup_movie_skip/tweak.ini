[Tweak]
id=startup_movie_skip
name=Startup Movie Skip
description=Skips startup intro movies while leaving menu/background videos alone.
version=0.1.0
dll=StartupMovieSkip.dll
config_key=startup_movie_skip
default_enabled=1
log=StartupMovieSkip.log

[Settings]
skip_16t=StartupMovieSkip|skip_16t|Skip 16t startup movie|bool|1
skip_intro=StartupMovieSkip|skip_intro|Skip Intro startup movie|bool|1
